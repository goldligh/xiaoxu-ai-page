<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小徐 AI 对话页 · 交互动效</title>
<style>
  :root {
    --blue: #2f7cff;
    --blue-deep: #1e63e8;
    --blue-soft: #eaf2ff;
    --ink: #1a1a1a;
    --ink-2: #4a5568;
    --ink-3: #8a94a6;
    --line: #edf0f5;
    --chip-bg: #f4f6f9;
    --orange: #ff9f2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC",
      "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(1200px 700px at 20% -10%, #dfeaff 0%, transparent 55%),
                radial-gradient(1000px 600px at 110% 110%, #e3ecff 0%, transparent 50%),
                #eef1f6;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    overflow: hidden;
  }

  /* ============ 手机外框 ============ */
  .phone {
    position: relative;
    width: 400px; height: min(880px, 96vh);
    background: #fff;
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(31, 68, 140, .22), 0 4px 18px rgba(31, 68, 140, .12),
      inset 0 0 0 1px rgba(255,255,255,.6);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  @media (max-width: 520px), (max-height: 700px) {
    .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
  }

  /* ============ 状态栏 ============ */
  .statusbar {
    height: 40px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px 0 26px;
    font-size: 14px; font-weight: 600; letter-spacing: .3px;
  }
  .statusbar .sicons { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { display: block; }

  /* ============ 头部 ============ */
  header {
    flex: none; height: 56px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px;
  }
  .logo-wrap {
    position: relative; width: 42px; height: 42px; flex: none;
    border-radius: 12px; background: linear-gradient(145deg, #f2f7ff, #dde9ff);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none;
    transition: transform .25s, box-shadow .25s;
  }
  .logo-wrap img { width: 34px; height: 34px; object-fit: contain; pointer-events: none; }
  .logo-wrap.flash { animation: logoFlash .8s ease; }
  @keyframes logoFlash {
    0% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 0 0 rgba(47,124,255,.5); }
    35% { transform: scale(1.18); filter: brightness(1.45); box-shadow: 0 0 0 14px rgba(47,124,255,.12); }
    100% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 0 0 rgba(47,124,255,0); }
  }
  .spark-layer { position: absolute; inset: -20px; pointer-events: none; overflow: visible; }
  .spark {
    position: absolute; left: 50%; top: 50%;
    font-size: 14px; line-height: 1; color: #ffc53d;
    text-shadow: 0 0 6px rgba(255, 197, 61, .9);
    animation: sparkFly .85s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes sparkFly {
    0% { transform: translate(-50%,-50%) scale(.2) rotate(0deg); opacity: 0; }
    25% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--sc)) rotate(var(--rot)); opacity: 0; }
  }
  .title-box { display: flex; flex-direction: column; justify-content: center; gap: 1px; }
  .title-row { display: flex; align-items: center; gap: 4px; }
  .title-row .name { font-size: 17px; font-weight: 700; }
  .title-row .chev {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #9aa5b8; cursor: pointer; transition: background .2s, transform .2s;
  }
  .title-row .chev:hover { background: var(--chip-bg); color: var(--blue); transform: translateX(2px); }
  .subtitle { font-size: 11px; color: var(--ink-3); }
  header .spacer { flex: 1; }
  .hbtn {
    width: 38px; height: 38px; border: none; background: transparent; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #39415a; cursor: pointer; transition: background .2s, color .2s;
  }
  .hbtn:hover { background: var(--chip-bg); }
  .hbtn.on { color: var(--blue); }
  .hbtn.on .waves path { opacity: 1; animation: wavePulse 1.1s ease-in-out infinite; }
  .hbtn.on .waves path:nth-child(2) { animation-delay: .18s; }
  .hbtn.on .waves path:nth-child(3) { animation-delay: .36s; }
  @keyframes wavePulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  /* ============ 提示横幅 ============ */
  .banner {
    flex: none; overflow: hidden;
    max-height: 0; opacity: 0; transform: translateY(-8px);
    transition: max-height .35s ease, opacity .3s, transform .35s, margin .35s;
    margin: 0 20px;
  }
  .banner.show { max-height: 46px; opacity: 1; transform: translateY(0); margin: 2px 20px 8px; }
  .banner .pill {
    height: 38px; border-radius: 19px;
    background: linear-gradient(90deg, #3d8bff, #2b6fff);
    color: #fff; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 6px 16px rgba(43, 111, 255, .35);
    animation: pillIn .4s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pillIn { from { transform: scale(.9); } to { transform: scale(1); } }

  /* ============ 主区域 ============ */
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }

  /* --- 机器人舞台 --- */
  .stage {
    position: relative; flex: 1 1 42%; min-height: 250px;
    display: flex; align-items: center; justify-content: center;
  }
  .stage-glow {
    position: absolute; left: 50%; top: 54%; transform: translate(-50%,-50%);
    width: 78%; height: 82%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(214,231,255,.9), rgba(233,242,255,.35) 62%, transparent 75%);
    pointer-events: none;
  }
  .robot-bob { animation: bob 3.4s ease-in-out infinite; position: relative; z-index: 2; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

  .robot-pose {
    position: relative;
    height: clamp(230px, 34vh, 330px); aspect-ratio: 1 / 1.1;
    transition: transform .9s cubic-bezier(.5,0,.75,.35);
  }
  .robot-pose img {
    position: absolute; inset: 0; margin: auto;
    max-width: 100%; max-height: 100%; object-fit: contain;
    opacity: 0; transform: scale(.94);
    transition: opacity .28s ease, transform .32s cubic-bezier(.2,.9,.3,1.25);
    pointer-events: none;
    filter: drop-shadow(0 14px 18px rgba(40, 80, 180, .12));
  }
  .robot-pose img.show { opacity: 1; transform: scale(1); }

  .robot-shadow {
    position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%);
    width: 150px; height: 22px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(50,80,150,.28), transparent 70%);
    transition: transform .9s ease, opacity .9s ease;
    pointer-events: none; z-index: 1;
  }

  /* 起飞序列 */
  .robot-bob.arming .robot-pose { animation: arm .38s linear; }
  @keyframes arm {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-4px) rotate(-1.2deg); }
    45% { transform: translateX(4px) rotate(1.2deg); }
    70% { transform: translateX(-3px); }
    90% { transform: translateX(2px); }
  }
  .robot-bob.flying .robot-pose { transform: translateY(-190px) scale(.9); transition-timing-function: cubic-bezier(.45,.05,.7,.4); }
  .robot-bob.flying .robot-shadow { transform: translateX(-50%) scale(.35); opacity: .15; }
  .robot-bob.landing .robot-pose { animation: land .65s cubic-bezier(.25,.9,.35,1.15); }
  @keyframes land {
    0% { transform: translateY(-190px) scale(.9); }
    62% { transform: translateY(6px) scale(1.02); }
    82% { transform: translateY(-3px) scale(.995); }
    100% { transform: translateY(0) scale(1); }
  }

  /* 火焰粒子 */
  .flame-layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: visible; }
  .fp {
    position: absolute; left: 50%; top: 60%; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle, #ffd66e, #ff9f2e 55%, rgba(255,80,0,0) 75%);
    animation: fpFly .9s ease-out forwards;
  }
  @keyframes fpFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), 90px) scale(.15); opacity: 0; }
  }

  /* 弧线箭头 */
  .arc { position: absolute; left: 50%; top: 1%; transform: translateX(-50%); width: 74%; z-index: 4; pointer-events: none; opacity: 0; }
  .arc.play { opacity: 1; }
  .arc path.draw {
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: drawArc .55s .05s ease forwards;
  }
  @keyframes drawArc { to { stroke-dashoffset: 0; } }
  .arc.fade { animation: arcFade .4s 1.9s forwards; }
  @keyframes arcFade { to { opacity: 0; } }
  .arc.mirror { transform: translateX(-50%) scaleX(-1); }

  /* 圆点指示器 */
  .dot-ind {
    position: absolute; top: 44%; width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid var(--blue); background: rgba(47,124,255,.06);
    display: flex; align-items: center; justify-content: center;
    z-index: 4; pointer-events: none;
    opacity: 0;
  }
  .dot-ind i { width: 11px; height: 11px; border-radius: 50%; background: var(--blue); display: block; }
  .dot-ind.left { left: 6%; }
  .dot-ind.right { right: 6%; }
  .dot-ind.pop { animation: dotPop 2.4s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes dotPop {
    0% { opacity: 0; transform: scale(.3); }
    12% { opacity: 1; transform: scale(1.12); }
    20% { transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(.9); }
  }
  .dot-ind.pop::after {
    content: ""; position: absolute; inset: -2px; border-radius: 50%;
    border: 2px solid rgba(47,124,255,.55);
    animation: ringPulse 1.2s .3s ease-out infinite;
  }
  @keyframes ringPulse { from { transform: scale(1); opacity: 1; } to { transform: scale(1.65); opacity: 0; } }

  /* 热区涟漪提示 */
  .ripple {
    position: absolute; border-radius: 50%; border: 1.5px solid rgba(47,124,255,.5);
    pointer-events: none; z-index: 1; opacity: 0;
  }
  .stage.hint .ripple { animation: rippleAnim 2.6s ease-out infinite; }
  .ripple.r1 { left: 8%; top: 40%; width: 40px; height: 40px; }
  .ripple.r2 { right: 8%; top: 40%; width: 40px; height: 40px; animation-delay: 1.3s !important; }
  .ripple.r3 { left: 50%; top: 30%; width: 90px; height: 90px; transform: translateX(-50%); animation-delay: .65s !important; border-color: rgba(255,159,46,.55); }
  @keyframes rippleAnim {
    0% { opacity: 0; transform: scale(.55); }
    18% { opacity: .9; }
    70%, 100% { opacity: 0; transform: scale(1.5); }
  }
  .ripple.r3 { animation-name: rippleAnimC; }
  @keyframes rippleAnimC {
    0% { opacity: 0; transform: translateX(-50%) scale(.55); }
    18% { opacity: .9; }
    70%, 100% { opacity: 0; transform: translateX(-50%) scale(1.5); }
  }

  /* 热区按钮（透明） */
  .zone { position: absolute; top: 0; bottom: 0; border: none; background: transparent; cursor: pointer; z-index: 5; }
  .zone.left { left: 0; width: 30%; }
  .zone.center { left: 30%; width: 40%; }
  .zone.right { right: 0; width: 30%; }
  .zone:active { background: rgba(47,124,255,.05); }

  /* ============ 欢迎面板 ============ */
  .panel { flex: none; padding: 2px 20px 6px; transition: opacity .3s, transform .3s; }
  .panel.hidden { display: none; }
  .greeting {
    text-align: center; font-size: 21px; font-weight: 800; letter-spacing: .5px;
    margin: 2px 0 18px; min-height: 30px;
  }
  .greeting.swap { animation: greetIn .45s cubic-bezier(.2,.8,.3,1.1); }
  @keyframes greetIn {
    0% { opacity: 0; transform: translateY(10px) scale(.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .chips { display: flex; flex-direction: column; gap: 9px; align-items: center; }
  .chip {
    max-width: 100%; padding: 11px 18px; border-radius: 16px;
    background: var(--chip-bg); color: #3c4356; font-size: 14px;
    border: none; cursor: pointer; text-align: center;
    transition: background .2s, transform .2s, box-shadow .2s;
    animation: chipIn .4s both;
  }
  .chip:hover { background: var(--blue-soft); color: var(--blue-deep); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(43,111,255,.12); }
  .chip:nth-child(1) { animation-delay: .03s; } .chip:nth-child(2) { animation-delay: .1s; } .chip:nth-child(3) { animation-delay: .17s; }
  @keyframes chipIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .chips.leaving .chip { animation: chipOut .22s both; }
  @keyframes chipOut { to { opacity: 0; transform: translateY(-8px); } }

  .refresh {
    margin-top: 10px; display: inline-flex; align-items: center; gap: 5px;
    background: none; border: none; color: #9aa5b8; font-size: 12px; cursor: pointer;
    padding: 4px 10px; border-radius: 12px; transition: color .2s, background .2s;
  }
  .refresh:hover { color: var(--blue); background: var(--chip-bg); }
  .refresh svg { transition: transform .5s cubic-bezier(.3,.7,.3,1); }
  .refresh.spin svg { transform: rotate(-360deg); }

  .modes { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .mode {
    flex: 1; max-width: 118px; height: 42px; border-radius: 21px;
    background: #fff; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: #39415a; cursor: pointer;
    transition: all .22s;
    box-shadow: 0 2px 8px rgba(30,60,130,.05);
  }
  .mode:hover { border-color: #cfe0ff; }
  .mode.active {
    background: var(--blue-soft); border-color: rgba(47,124,255,.5); color: var(--blue-deep);
    box-shadow: 0 4px 14px rgba(43,111,255,.16);
    transform: translateY(-1px);
  }
  .mode .mi { width: 18px; height: 18px; flex: none; }

  /* ============ 对话记录 ============ */
  .chatlog {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px 18px 12px;
    display: none; flex-direction: column; gap: 12px; scroll-behavior: smooth;
  }
  .chatlog.show { display: flex; }
  .msg { max-width: 82%; padding: 11px 14px; border-radius: 16px; font-size: 14px; line-height: 1.6; animation: msgIn .35s cubic-bezier(.2,.8,.3,1.1); white-space: pre-wrap; word-break: break-word; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #3d8bff, #2b6fff); color: #fff; border-bottom-right-radius: 5px; box-shadow: 0 6px 16px rgba(43,111,255,.25); }
  .msg.bot { align-self: flex-start; background: #fff; border: 1px solid var(--line); color: #2c3347; border-bottom-left-radius: 5px; box-shadow: 0 3px 10px rgba(30,60,130,.06); }
  .msg.typing { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
  .msg.typing i { width: 7px; height: 7px; border-radius: 50%; background: #a9b6cc; animation: tp 1s infinite; }
  .msg.typing i:nth-child(2) { animation-delay: .15s; } .msg.typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes tp { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-4px); opacity: 1; } }
  .chat-tip { text-align: center; font-size: 11px; color: #aeb8ca; margin-top: 2px; }

  /* ============ 底部输入区 ============ */
  footer { flex: none; padding: 8px 16px 6px; }
  .inputbar {
    display: flex; align-items: center; gap: 8px;
    background: #f3f5f9; border: 1px solid transparent; border-radius: 24px;
    padding: 6px 6px 6px 18px; transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .inputbar:focus-within { background: #fff; border-color: #bfd6ff; box-shadow: 0 0 0 4px rgba(47,124,255,.08); }
  .inputbar input { flex: 1; border: none; outline: none; background: transparent; font-size: 14px; color: var(--ink); height: 34px; }
  .inputbar input::placeholder { color: #a7b0c2; }
  .icobtn {
    width: 36px; height: 36px; flex: none; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: #232b3d; color: #fff; transition: transform .15s, background .2s, opacity .2s;
  }
  .icobtn:active { transform: scale(.9); }
  .icobtn.send { background: linear-gradient(135deg, #3d8bff, #2b6fff); box-shadow: 0 4px 12px rgba(43,111,255,.4); display: none; }
  .inputbar.has-text .send { display: flex; animation: sendIn .2s ease; }
  .inputbar.has-text .mic { display: none; }
  @keyframes sendIn { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .ai-note { text-align: center; font-size: 10.5px; color: #b3bccb; margin-top: 8px; letter-spacing: 1px; }

  /* ============ 交互说明（图6） ============ */
  .guide {
    position: absolute; inset: 0; z-index: 50; background: #fff;
    display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .45s cubic-bezier(.3,.8,.3,1);
  }
  .guide.open { transform: translateY(0); }
  .guide-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px 4px; }
  .g-logo {
    width: 42px; height: 42px; border-radius: 12px; border: 1.5px dashed var(--orange);
    display: flex; align-items: center; justify-content: center; position: relative;
    animation: dashGlow 2s ease-in-out infinite;
  }
  @keyframes dashGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,159,46,.35); } 50% { box-shadow: 0 0 0 6px rgba(255,159,46,.1); } }
  .g-logo img { width: 30px; height: 30px; object-fit: contain; }
  .badge {
    position: absolute; width: 20px; height: 20px; border-radius: 50%;
    color: #fff; font-size: 11.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,.18);
  }
  .badge.b4 { right: -8px; bottom: -8px; background: var(--orange); }
  .badge.b4::before { content: "4"; }
  .g-title { font-size: 17px; font-weight: 700; }
  .g-sub { font-size: 11px; color: var(--ink-3); }
  .guide-head .spacer { flex: 1; }
  .g-close { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--chip-bg); color: #4a5568; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, transform .2s; }
  .g-close:hover { background: #e8edf5; transform: rotate(90deg); }
  .g-heading { text-align: center; font-size: 18px; font-weight: 800; margin: 16px 0 12px; letter-spacing: .5px; }

  .g-stage { position: relative; height: 250px; margin: 0 18px; display: flex; align-items: center; justify-content: center; }
  .g-stage img { height: 215px; object-fit: contain; pointer-events: none; }
  .hotbox { position: absolute; border: 1.5px dashed #9db9f5; border-radius: 16px; background: rgba(214,231,255,.14); cursor: pointer; transition: background .2s, border-color .2s; }
  .hotbox:hover { background: rgba(214,231,255,.45); border-color: var(--blue); }
  .hotbox.hb-left { left: 0; top: 12%; width: 27%; height: 76%; }
  .hotbox.hb-right { right: 0; top: 12%; width: 27%; height: 76%; }
  .hotbox.hb-jet { left: 22%; right: 22%; top: 38%; height: 26%; border-color: #ffcf96; background: rgba(255,214,150,.16); border-radius: 14px; }
  .hotbox.hb-jet:hover { border-color: var(--orange); background: rgba(255,214,150,.4); }
  .badge.b1 { left: 10px; top: 8px; background: var(--blue); } .badge.b1::before { content: "1"; }
  .badge.b2 { right: 10px; top: 8px; background: var(--blue); } .badge.b2::before { content: "2"; }
  .badge.b3 { right: 8px; top: 50%; transform: translateY(-50%); background: var(--orange); } .badge.b3::before { content: "3"; }

  .g-list { margin: 18px 16px 0; display: flex; flex-direction: column; gap: 10px; }
  .g-item {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    cursor: pointer; transition: all .2s; box-shadow: 0 3px 10px rgba(30,60,130,.05);
  }
  .g-item:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,60,130,.12); border-color: #cfe0ff; }
  .g-num { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .g-num.n1, .g-num.n2 { background: var(--blue); }
  .g-num.n3, .g-num.n4 { background: var(--orange); }
  .g-item .t1 { font-size: 14px; font-weight: 700; color: #232a3d; }
  .g-item .t2 { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

  /* ============ Toast ============ */
  .toast {
    position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%) translateY(20px);
    background: rgba(30, 38, 56, .92); color: #fff; font-size: 12.5px;
    padding: 9px 16px; border-radius: 18px; opacity: 0; pointer-events: none;
    transition: opacity .3s, transform .3s; z-index: 60; white-space: nowrap;
    backdrop-filter: blur(4px);

<body>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));

  const GREETINGS = {
    idle: '下午好，需要我帮你做点什么？',
    left: '好嘞，我往左边看看',
    right: '好嘞，我往右边看看',
    fly: '点火起飞，跟我出发！',
    logo: '我是徐工智能助手小徐',
  };
  const BANNERS = {
    left: '点左侧空白 · 小徐向左转身',
    right: '点右侧空白 · 小徐向右转身',
    fly: '点背部飞行器 · 喷火起飞',
    logo: '点徐工图标 · 高亮闪光',
  };
  const CHIP_SETS = [
    ['如何查询设备保修信息', '怎么预约上门维保服务', '设备故障如何快速报修'],
    ['起重机日常保养有哪些要点', '原厂配件从哪里购买', '如何查询附近服务网点'],
    ['泵车操作注意事项', '设备租赁方案怎么选', '新机交付验收流程是什么'],
  ];

  const state = { pose: 'front', busy: false, chipSet: 0, chatStarted: false, timer: null, hintDone: false };

  const robotBob = $('#robotBob'), robotPose = $('#robotPose'), stage = $('#stage');
  const banner = $('#banner'), bannerText = $('#bannerText');
  const greeting = $('#greeting'), panel = $('#panel'), chatlog = $('#chatlog');
  const toastEl = $('#toast'), input = $('#input'), inputbar = $('#inputbar');
  const chipsBox = $('#chips');

  /* ---------- 工具 ---------- */
  function toast(msg, ms = 1800) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  function setPose(name) {
    $$('#robotPose img').forEach((img) => img.classList.toggle('show', img.dataset.pose === name));
    state.pose = name;
  }

  function setGreeting(text) {
    greeting.textContent = text;
    greeting.classList.remove('swap');
    void greeting.offsetWidth;
    greeting.classList.add('swap');
  }

  function showBanner(text) {
    bannerText.textContent = text;
    banner.classList.add('show');
  }
  function hideBanner() { banner.classList.remove('show'); }

  function restartAnim(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function scheduleIdle() {
    clearTimeout(state.timer);
    state.timer = setTimeout(() => {
      if (state.busy) return scheduleIdle();
      if (state.pose !== 'front') setPose('front');
      setGreeting(GREETINGS.idle);
      hideBanner();
    }, 5000);
  }

  /* ---------- 动作 ---------- */
  function actLeft() {
    if (state.busy) return;
    setPose('left');
    showBanner(BANNERS.left);
    setGreeting(GREETINGS.left);
    restartAnim($('#arcLeft'), 'play');
    $('#arcLeft').classList.remove('fade'); void $('#arcLeft').offsetWidth; $('#arcLeft').classList.add('fade');
    restartAnim($('#dotLeft'), 'pop');
    scheduleIdle();
  }

  function actRight() {
    if (state.busy) return;
    setPose('right');
    showBanner(BANNERS.right);
    setGreeting(GREETINGS.right);
    restartAnim($('#arcRight'), 'play');
    $('#arcRight').classList.remove('fade'); void $('#arcRight').offsetWidth; $('#arcRight').classList.add('fade');
    restartAnim($('#dotRight'), 'pop');
    scheduleIdle();
  }

  function actFly() {
    if (state.busy) return;
    state.busy = true;
    showBanner(BANNERS.fly);
    setGreeting(GREETINGS.fly);
    clearTimeout(state.timer);

    robotBob.classList.add('arming');
    setTimeout(() => {
      robotBob.classList.remove('arming');
      setPose('fly');
      spawnFlames();
      robotBob.classList.add('flying');
    }, 400);

    setTimeout(() => { robotBob.classList.remove('flying'); robotBob.classList.add('landing'); }, 2100);
    setTimeout(() => {
      robotBob.classList.remove('landing');
      setPose('front');
      state.busy = false;
      scheduleIdle();
    }, 2800);
  }

  function spawnFlames() {
    const layer = $('#flameLayer');
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      s.className = 'fp';
      s.style.setProperty('--dx', (Math.random() * 140 - 70) + 'px');
      s.style.top = (52 + Math.random() * 14) + '%';
      s.style.animationDelay = (Math.random() * .35) + 's';
      s.style.width = s.style.height = (5 + Math.random() * 7) + 'px';
      layer.appendChild(s);
      setTimeout(() => s.remove(), 1400);
    }
  }

  function actLogo() {
    if (state.busy) return;
    showBanner(BANNERS.logo);
    setGreeting(GREETINGS.logo);
    const wrap = $('#logoBtn');
    restartAnim(wrap, 'flash');
    const layer = $('#sparkLayer');
    layer.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const sp = document.createElement('span');
      sp.className = 'spark';
      sp.textContent = '✦';
      const ang = (i / 9) * Math.PI * 2 + Math.random() * .5;
      const dist = 26 + Math.random() * 22;
      sp.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      sp.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      sp.style.setProperty('--sc', (0.7 + Math.random() * 0.9).toFixed(2));
      sp.style.setProperty('--rot', (Math.random() * 220 - 110).toFixed(0) + 'deg');
      sp.style.animationDelay = (Math.random() * .12) + 's';
      layer.appendChild(sp);
    }
    scheduleIdle();
  }

  const ACTIONS = { left: actLeft, right: actRight, fly: actFly, logo: actLogo };

  /* ---------- 事件绑定 ---------- */
  $$('.zone').forEach((z) => z.addEventListener('click', () => {
    ACTIONS[z.dataset.act]();
    dismissHint();
  }));
  $('#logoBtn').addEventListener('click', () => { ACTIONS.logo(); dismissHint(); });
  $('#voiceBtn').addEventListener('click', function () {
    this.classList.toggle('on');
    toast(this.classList.contains('on') ? '语音播报已开启' : '语音播报已关闭');
  });
  $('#resetBtn').addEventListener('click', () => {
    clearTimeout(state.timer);
    state.busy = false;
    robotBob.classList.remove('arming', 'flying', 'landing');
    setPose('front');
    setGreeting(GREETINGS.idle);
    hideBanner();
    if (state.chatStarted) resetChat();
    toast('已回到欢迎页');
  });

  /* 交互说明 */
  const guide = $('#guide');
  $('#guideBtn').addEventListener('click', () => guide.classList.add('open'));
  $('#guideClose').addEventListener('click', () => guide.classList.remove('open'));
  $$('.g-item, .hotbox').forEach((el) => el.addEventListener('click', () => {
    guide.classList.remove('open');
    setTimeout(() => ACTIONS[el.dataset.act] && ACTIONS[el.dataset.act](), 250);
    dismissHint();
  }));

  /* 提示涟漪：首次交互后消失 */
  function dismissHint() {
    if (state.hintDone) return;
    state.hintDone = true;
    setTimeout(() => stage.classList.remove('hint'), 600);
  }

  /* ---------- 推荐问题 ---------- */
  function renderChips() {
    chipsBox.innerHTML = '';
    CHIP_SETS[state.chipSet].forEach((text, i) => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = text;
      b.style.animationDelay = (i * 0.06) + 's';
      b.addEventListener('click', () => {
        input.value = text;
        input.dispatchEvent(new Event('input'));
        input.focus();
      });
      chipsBox.appendChild(b);
    });
  }
  renderChips();

  $('#refreshBtn').addEventListener('click', function () {
    this.classList.remove('spin'); void this.offsetWidth; this.classList.add('spin');
    chipsBox.classList.add('leaving');
    setTimeout(() => {
      chipsBox.classList.remove('leaving');
      state.chipSet = (state.chipSet + 1) % CHIP_SETS.length;
      renderChips();
    }, 230);
  });

  /* ---------- 模式切换 ---------- */
  $$('.mode').forEach((m) => m.addEventListener('click', function () {
    $$('.mode').forEach((x) => x.classList.remove('active'));
    this.classList.add('active');
    toast(`已切换到「${this.dataset.mode}」模式`);
  }));

  /* ---------- 对话 ---------- */
  const REPLIES = [
    { k: ['保修', '质保'], r: '您好！您可以登录徐工官网服务专区，输入设备编号查询保修信息与质保期限；也可以拨打服务热线 400-110-9999，由客服协助查询。' },
    { k: ['预约', '维保', '保养', '上门'], r: '收到！上门维保可在徐工服务小程序预约：选择设备型号、填写故障描述后，系统会自动指派就近的服务工程师，一般 24 小时内响应。' },
    { k: ['报修', '故障', '维修', '坏了'], r: '设备报修请准备好设备序列号与故障现象描述，拨打 400-110-9999 服务热线，或切换到「故障诊断」模式，我会逐步帮您排查。' },
    { k: ['配件', '零件', '购买'], r: '原厂配件可通过徐工配件商城或当地授权经销商购买，正品保障、全国联保，支持在线查询物流进度。' },
    { k: ['网点', '服务', '附近', '地址'], r: '您可以在徐工官网「服务网点」页面按城市查询最近网点，支持地图导航与电话直连，部分地区还提供驻矿驻点服务。' },
    { k: ['你好', '您好', 'hi', 'Hi'], r: '您好！我是徐工智能助手小徐，可以帮您查保修、约维保、报故障，也可以点我周围的空白区域和我互动哦～' },
  ];
  const GENERIC = (q) => `好的，我已收到您的问题：「${q}」。这是交互动效演示页面，正式环境中我会结合徐工设备知识库为您详细解答。您也可以点击下方推荐问题快速开始。`;

  function addMsg(text, who) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    chatlog.appendChild(d);
    chatlog.scrollTop = chatlog.scrollHeight;
    return d;
  }

  function startChat() {
    if (state.chatStarted) return;
    state.chatStarted = true;
    panel.classList.add('hidden');
    chatlog.classList.add('show');
    const tip = document.createElement('div');
    tip.className = 'chat-tip';
    tip.textContent = '对话已开启 · 点右上角 × 可回到欢迎页';
    chatlog.appendChild(tip);
  }

  function resetChat() {
    state.chatStarted = false;
    chatlog.classList.remove('show');
    chatlog.innerHTML = '';
    panel.classList.remove('hidden');
  }

  function replyFor(q) {
    for (const item of REPLIES) if (item.k.some((k) => q.includes(k))) return item.r;
    return GENERIC(q);
  }

  function send() {
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    input.dispatchEvent(new Event('input'));
    startChat();
    addMsg(q, 'user');
    const typing = document.createElement('div');
    typing.className = 'msg bot typing';
    typing.innerHTML = '<i></i><i></i><i></i>';
    setTimeout(() => {
      chatlog.appendChild(typing);
      chatlog.scrollTop = chatlog.scrollHeight;
    }, 350);
    setTimeout(() => {
      typing.remove();
      addMsg(replyFor(q), 'bot');
    }, 1500 + Math.random() * 700);
  }

  $('#sendBtn').addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  input.addEventListener('input', () => inputbar.classList.toggle('has-text', !!input.value.trim()));
  $('#micBtn').addEventListener('click', () => toast('语音输入为演示功能'));

  /* ---------- 入场 ---------- */
  window.addEventListener('load', () => {
    setTimeout(() => toast('点击小徐两侧的空白、背部飞行器或左上角图标，看看会发生什么～', 2600), 900);
  });
})();
</script>
</body>
</html>
