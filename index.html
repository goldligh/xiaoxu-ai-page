<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小徐 AI 对话页 · 交互动效</title>
<style>
  :root {
    --blue: #2f7cff;
    --blue-deep: #1e63e8;
    --blue-soft: #eaf2ff;
    --ink: #1a1a1a;
    --ink-2: #4a5568;
    --ink-3: #8a94a6;
    --line: #edf0f5;
    --chip-bg: #f4f6f9;
    --orange: #ff9f2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC",
      "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(1200px 700px at 20% -10%, #dfeaff 0%, transparent 55%),
                radial-gradient(1000px 600px at 110% 110%, #e3ecff 0%, transparent 50%),
                #eef1f6;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    overflow: hidden;
  }

  /* ============ 手机外框 ============ */
  .phone {
    position: relative;
    width: 400px; height: min(880px, 96vh);
    background: #fff;
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(31, 68, 140, .22), 0 4px 18px rgba(31, 68, 140, .12),
      inset 0 0 0 1px rgba(255,255,255,.6);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  @media (max-width: 520px), (max-height: 700px) {
    .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
  }

  /* ============ 状态栏 ============ */
  .statusbar {
    height: 40px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px 0 26px;
    font-size: 14px; font-weight: 600; letter-spacing: .3px;
  }
  .statusbar .sicons { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { display: block; }

  /* ============ 头部 ============ */
  header {
    flex: none; height: 56px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px;
  }
  .spark-layer { position: absolute; inset: -24px; pointer-events: none; overflow: visible; z-index: 3; }
  .spark {
    position: absolute; left: 50%; top: 50%;
    font-size: 14px; line-height: 1; color: #ffc53d;
    text-shadow: 0 0 6px rgba(255, 197, 61, .9);
    animation: sparkFly .85s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes sparkFly {
    0% { transform: translate(-50%,-50%) scale(.2) rotate(0deg); opacity: 0; }
    25% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--sc)) rotate(var(--rot)); opacity: 0; }
  }
  .logo-wrap {
    width: 42px; height: 42px; flex: none;
    border-radius: 12px; background: linear-gradient(145deg, #f2f7ff, #dde9ff);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-wrap img { width: 34px; height: 34px; object-fit: contain; }
  .title-box { display: flex; flex-direction: column; justify-content: center; gap: 1px; }
  .title-row { display: flex; align-items: center; gap: 4px; }
  .title-row .name { font-size: 17px; font-weight: 700; }
  .title-row .chev {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #9aa5b8; cursor: pointer; transition: background .2s, transform .2s;
  }
  .title-row .chev:hover { background: var(--chip-bg); color: var(--blue); transform: translateX(2px); }
  .subtitle { font-size: 11px; color: var(--ink-3); }
  header .spacer { flex: 1; }
  .hbtn {
    width: 38px; height: 38px; border: none; background: transparent; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #39415a; cursor: pointer; transition: background .2s, color .2s;
  }
  .hbtn:hover { background: var(--chip-bg); }
  .hbtn.on { color: var(--blue); }
  .hbtn.on .waves path { opacity: 1; animation: wavePulse 1.1s ease-in-out infinite; }
  .hbtn.on .waves path:nth-child(2) { animation-delay: .18s; }
  .hbtn.on .waves path:nth-child(3) { animation-delay: .36s; }
  @keyframes wavePulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  /* ============ 提示横幅 ============ */
  .banner {
    flex: none; overflow: hidden;
    max-height: 0; opacity: 0; transform: translateY(-8px);
    transition: max-height .35s ease, opacity .3s, transform .35s, margin .35s;
    margin: 0 20px;
  }
  .banner.show { max-height: 46px; opacity: 1; transform: translateY(0); margin: 2px 20px 8px; }
  .banner .pill {
    height: 38px; border-radius: 19px;
    background: linear-gradient(90deg, #3d8bff, #2b6fff);
    color: #fff; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 6px 16px rgba(43, 111, 255, .35);
    animation: pillIn .4s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pillIn { from { transform: scale(.9); } to { transform: scale(1); } }

  /* ============ 主区域 ============ */
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }

  /* --- 机器人舞台 --- */
  .stage {
    position: relative; flex: 1 1 42%; min-height: 250px;
    display: flex; align-items: center; justify-content: center;
    perspective: 1000px;
  }
  .stage-glow {
    position: absolute; left: 50%; top: 54%; transform: translate(-50%,-50%);
    width: 78%; height: 82%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(214,231,255,.9), rgba(233,242,255,.35) 62%, transparent 75%);
    pointer-events: none;
  }
  .robot-bob { animation: bob 3.4s ease-in-out infinite; position: relative; z-index: 2; }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotateY(-2.5deg); }
    50% { transform: translateY(-9px) rotateY(2.5deg); }
  }

  .robot-pose {
    position: relative;
    height: clamp(230px, 34vh, 330px); aspect-ratio: 1 / 1.1;
    transform: rotateY(0deg);
    transition: transform .55s cubic-bezier(.2,.8,.3,1.12);
    will-change: transform;
  }
  .robot-pose img[data-pose] {
    position: absolute; inset: 0; margin: auto;
    max-width: 100%; max-height: 100%; object-fit: contain;
    opacity: 0; transform: scale(.94);
    transition: opacity .28s ease, transform .32s cubic-bezier(.2,.9,.3,1.25);
    pointer-events: none;
    filter: drop-shadow(0 14px 18px rgba(40, 80, 180, .12));
  }
  .robot-pose img[data-pose].show { opacity: 1; transform: scale(1); }

  .robot-shadow {
    position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%);
    width: 150px; height: 22px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(50,80,150,.28), transparent 70%);
    transition: transform .5s ease, opacity .5s ease;
    pointer-events: none; z-index: 1;
  }

  .robot-pose.dragging img[data-pose] { transition: opacity .06s linear; transform: scale(1); }

  /* 右臂属具循环 */
  .arm-tool {
    position: absolute; left: 51%; top: 43%; width: 29%;
    z-index: 2; pointer-events: none;
    transform: rotate(-22deg); transform-origin: 24% 58%;
    transition: opacity .3s;
  }
  .arm-tool.hidden { opacity: 0; }
  .arm-tool img { width: 100%; display: block; filter: drop-shadow(0 8px 12px rgba(20,40,110,.4)); }
  .arm-tool.cycling { animation: toolCycle .95s cubic-bezier(.34,.7,.3,1); }
  @keyframes toolCycle {
    0%, 100% { transform: rotate(-22deg) translateY(0); }
    38%, 58% { transform: rotate(-30deg) translateY(-32%); }
  }

  /* 左手接口标注 */
  .port-tag {
    position: absolute; left: 68%; top: 41%;
    z-index: 3; pointer-events: none;
    display: flex; align-items: center;
    opacity: 0; transform: translateX(8px);
    transition: opacity .5s ease .3s, transform .5s ease .3s;
  }
  .port-tag.on { opacity: 1; transform: translateX(0); animation: tagFloat 3.2s ease-in-out .8s infinite; }
  @keyframes tagFloat {
    0%,100% { transform: translateX(0) translateY(0); }
    50% { transform: translateX(0) translateY(-4px); }
  }
  .pt-dot { width: 8px; height: 8px; border-radius: 50%; background: #f5a623; box-shadow: 0 0 0 3px rgba(245,166,35,.22); flex: none; }
  .pt-line { width: 30px; height: 1.5px; background: #f5a623; margin: 0 -1px; flex: none; }
  .pt-label {
    flex: none;
    border: 1.5px solid #f5a623; border-radius: 999px;
    background: rgba(255,255,255,.92);
    color: #e8930c; font-size: 11.5px; font-weight: 700;
    padding: 4px 12px; white-space: nowrap;
    box-shadow: 0 4px 12px rgba(245,166,35,.18);
  }

  /* 思考动作：左手托腮 + 若有所思眼神 + 省略号气泡 */
  .think-arm {
    position: absolute; left: 32.5%; top: 11%; width: 30%;
    z-index: 2; pointer-events: none;
    opacity: 0; transform: rotate(8deg) translateY(18px) scale(.95);
    transform-origin: 72% 92%;
    transition: opacity .45s ease, transform .55s cubic-bezier(.2,.8,.3,1.2);
  }
  .robot-bob.thinking .think-arm { opacity: 1; transform: rotate(-7deg) translateY(0) scale(1); }
  .think-eyes {
    position: absolute; left: 36%; top: 25.5%; width: 20%;
    z-index: 2; pointer-events: none; opacity: 0;
    transition: opacity .3s ease .18s;
  }
  .think-eyes svg { width: 100%; display: block; }
  .robot-bob.thinking .think-eyes { opacity: 1; }
  .think-bubble {
    position: absolute; left: 47%; top: -7%;
    transform: translateX(-50%) translateY(10px) scale(.5);
    z-index: 3; pointer-events: none;
    background: #fff; border: 1.5px solid #e8edf5; border-radius: 16px;
    padding: 8px 13px 9px; display: flex; gap: 5px; align-items: center;
    box-shadow: 0 8px 20px rgba(31,68,140,.16);
    opacity: 0;
    transition: opacity .3s ease .32s, transform .45s cubic-bezier(.2,.8,.3,1.35) .32s;
  }
  .robot-bob.thinking .think-bubble { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  .tb-dot { width: 7px; height: 7px; border-radius: 50%; background: #9aa5b8; opacity: .25; animation: tbDot 1.1s infinite; }
  .tb-dot:nth-child(2) { animation-delay: .18s; }
  .tb-dot:nth-child(3) { animation-delay: .36s; }
  @keyframes tbDot {
    0%, 60%, 100% { opacity: .25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }
  .tb-tail {
    position: absolute; left: calc(50% - 6px); bottom: -6.5px;
    width: 11px; height: 11px; background: #fff;
    border-right: 1.5px solid #e8edf5; border-bottom: 1.5px solid #e8edf5;
    transform: rotate(45deg); border-bottom-right-radius: 3px;
  }

  /* 高亮放大闪光 */
  .robot-bob.spotlight .robot-pose { animation: spotGlow .95s cubic-bezier(.2,.8,.3,1.1); }
  @keyframes spotGlow {
    0% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 0 rgba(255,197,61,0)); }
    35% { transform: scale(1.14); filter: brightness(1.22) drop-shadow(0 0 26px rgba(255,197,61,.85)); }
    60% { transform: scale(1.09); filter: brightness(1.12) drop-shadow(0 0 14px rgba(255,197,61,.45)); }
    100% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 0 rgba(255,197,61,0)); }
  }

  /* 下拉蓄力 + 喷火升空 */
  .stage { touch-action: none; }
  .robot-pose.dragging { transition: none; }
  .robot-bob.charged .robot-pose {
    filter: brightness(1.18) drop-shadow(0 0 20px rgba(255,197,61,.75));
  }
  .robot-pose.launch { animation: launchUp .8s cubic-bezier(.55,.06,.75,.4) forwards; }
  @keyframes launchUp {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-460px) scale(.85); }
  }
  .robot-bob.launching .robot-shadow { transform: translateX(-50%) scale(.3); opacity: .12; transition: transform .8s ease, opacity .8s ease; }
  .robot-pose.landing { animation: land .7s cubic-bezier(.25,.9,.35,1.15); }
  @keyframes land {
    0% { transform: translateY(-460px) scale(.85); }
    62% { transform: translateY(8px) scale(1.03); }
    82% { transform: translateY(-4px) scale(.995); }
    100% { transform: translateY(0) scale(1); }
  }

  /* 火焰粒子 */
  .flame-layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: visible; }
  .fp {
    position: absolute; left: 50%; top: 58%; width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle, #ffe9a8, #ff9f2e 55%, rgba(255,90,0,0) 78%);
    animation: fpFly 1s ease-out forwards;
  }
  @keyframes fpFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), 160px) scale(.2); opacity: 0; }
  }

  /* 热区涟漪提示 */
  .ripple {
    position: absolute; border-radius: 50%; border: 1.5px solid rgba(47,124,255,.5);
    pointer-events: none; z-index: 1; opacity: 0;
  }
  .stage.hint .ripple { animation: rippleAnim 2.6s ease-out infinite; }
  .ripple.r1 { left: 8%; top: 40%; width: 40px; height: 40px; }
  .ripple.r2 { right: 8%; top: 40%; width: 40px; height: 40px; animation-delay: 1.3s !important; }
  .ripple.r3 { left: 50%; top: 30%; width: 90px; height: 90px; transform: translateX(-50%); animation-delay: .65s !important; border-color: rgba(255,159,46,.55); }
  @keyframes rippleAnim {
    0% { opacity: 0; transform: scale(.55); }
    18% { opacity: .9; }
    70%, 100% { opacity: 0; transform: scale(1.5); }
  }
  .ripple.r3 { animation-name: rippleAnimC; }
  @keyframes rippleAnimC {
    0% { opacity: 0; transform: translateX(-50%) scale(.55); }
    18% { opacity: .9; }
    70%, 100% { opacity: 0; transform: translateX(-50%) scale(1.5); }
  }

  /* 热区按钮（透明） */
  .zone { position: absolute; top: 0; bottom: 0; border: none; background: transparent; cursor: pointer; z-index: 5; }
  .zone .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .zone.left { left: 0; width: 30%; }
  .zone.center { left: 30%; width: 40%; }
  .zone.right { right: 0; width: 30%; }
  .zone:active { background: rgba(47,124,255,.05); }

  /* ============ 欢迎面板 ============ */
  .panel { flex: none; padding: 2px 20px 6px; transition: opacity .3s, transform .3s; }
  .panel.hidden { display: none; }
  .greeting {
    text-align: center; font-size: 21px; font-weight: 800; letter-spacing: .5px;
    margin: 2px 0 18px; min-height: 30px;
  }
  .greeting.swap { animation: greetIn .45s cubic-bezier(.2,.8,.3,1.1); }
  @keyframes greetIn {
    0% { opacity: 0; transform: translateY(10px) scale(.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .chips { display: flex; flex-direction: column; gap: 9px; align-items: center; }
  .chip {
    max-width: 100%; padding: 11px 18px; border-radius: 16px;
    background: var(--chip-bg); color: #3c4356; font-size: 14px;
    border: none; cursor: pointer; text-align: center;
    transition: background .2s, transform .2s, box-shadow .2s;
    animation: chipIn .4s both;
  }
  .chip:hover { background: var(--blue-soft); color: var(--blue-deep); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(43,111,255,.12); }
  .chip:nth-child(1) { animation-delay: .03s; } .chip:nth-child(2) { animation-delay: .1s; } .chip:nth-child(3) { animation-delay: .17s; }
  @keyframes chipIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .chips.leaving .chip { animation: chipOut .22s both; }
  @keyframes chipOut { to { opacity: 0; transform: translateY(-8px); } }

  .refresh {
    margin-top: 10px; display: inline-flex; align-items: center; gap: 5px;
    background: none; border: none; color: #9aa5b8; font-size: 12px; cursor: pointer;
    padding: 4px 10px; border-radius: 12px; transition: color .2s, background .2s;
  }
  .refresh:hover { color: var(--blue); background: var(--chip-bg); }
  .refresh svg { transition: transform .5s cubic-bezier(.3,.7,.3,1); }
  .refresh.spin svg { transform: rotate(-360deg); }

  .modes { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .mode {
    flex: 1; max-width: 118px; height: 42px; border-radius: 21px;
    background: #fff; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: #39415a; cursor: pointer;
    transition: all .22s;
    box-shadow: 0 2px 8px rgba(30,60,130,.05);
  }
  .mode:hover { border-color: #cfe0ff; }
  .mode.active {
    background: var(--blue-soft); border-color: rgba(47,124,255,.5); color: var(--blue-deep);
    box-shadow: 0 4px 14px rgba(43,111,255,.16);
    transform: translateY(-1px);
  }
  .mode .mi { width: 18px; height: 18px; flex: none; }

  /* ============ 对话记录 ============ */
  .chatlog {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px 18px 12px;
    display: none; flex-direction: column; gap: 12px; scroll-behavior: smooth;
  }
  .chatlog.show { display: flex; }
  .msg { max-width: 82%; padding: 11px 14px; border-radius: 16px; font-size: 14px; line-height: 1.6; animation: msgIn .35s cubic-bezier(.2,.8,.3,1.1); white-space: pre-wrap; word-break: break-word; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #3d8bff, #2b6fff); color: #fff; border-bottom-right-radius: 5px; box-shadow: 0 6px 16px rgba(43,111,255,.25); }
  .msg.bot { align-self: flex-start; background: #fff; border: 1px solid var(--line); color: #2c3347; border-bottom-left-radius: 5px; box-shadow: 0 3px 10px rgba(30,60,130,.06); }
  .msg.typing { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
  .msg.typing i { width: 7px; height: 7px; border-radius: 50%; background: #a9b6cc; animation: tp 1s infinite; }
  .msg.typing i:nth-child(2) { animation-delay: .15s; } .msg.typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes tp { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-4px); opacity: 1; } }
  .chat-tip { text-align: center; font-size: 11px; color: #aeb8ca; margin-top: 2px; }

  /* ============ 底部输入区 ============ */
  footer { flex: none; padding: 8px 16px 6px; }
  .inputbar {
    display: flex; align-items: center; gap: 8px;
    background: #f3f5f9; border: 1px solid transparent; border-radius: 24px;
    padding: 6px 6px 6px 18px; transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .inputbar:focus-within { background: #fff; border-color: #bfd6ff; box-shadow: 0 0 0 4px rgba(47,124,255,.08); }
  .inputbar input { flex: 1; border: none; outline: none; background: transparent; font-size: 14px; color: var(--ink); height: 34px; }
  .inputbar input::placeholder { color: #a7b0c2; }
  .icobtn {
    width: 36px; height: 36px; flex: none; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: #232b3d; color: #fff; transition: transform .15s, background .2s, opacity .2s;
  }
  .icobtn:active { transform: scale(.9); }
  .icobtn.send { background: linear-gradient(135deg, #3d8bff, #2b6fff); box-shadow: 0 4px 12px rgba(43,111,255,.4); display: none; }
  .inputbar.has-text .send { display: flex; animation: sendIn .2s ease; }
  .inputbar.has-text .mic { display: none; }
  @keyframes sendIn { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .ai-note { text-align: center; font-size: 10.5px; color: #b3bccb; margin-top: 8px; letter-spacing: 1px; }

  /* ============ 交互说明（图6） ============ */
  .guide {
    position: absolute; inset: 0; z-index: 50; background: #fff;
    display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .45s cubic-bezier(.3,.8,.3,1);
  }
  .guide.open { transform: translateY(0); }
  .guide-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px 4px; }
  .badge {
    position: absolute; width: 20px; height: 20px; border-radius: 50%;
    color: #fff; font-size: 11.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,.18);
  }
  .g-title { font-size: 17px; font-weight: 700; }
  .g-sub { font-size: 11px; color: var(--ink-3); }
  .guide-head .spacer { flex: 1; }
  .g-close { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--chip-bg); color: #4a5568; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, transform .2s; }
  .g-close:hover { background: #e8edf5; transform: rotate(90deg); }
  .g-heading { text-align: center; font-size: 18px; font-weight: 800; margin: 16px 0 12px; letter-spacing: .5px; }

  .g-stage { position: relative; height: 250px; margin: 0 18px; display: flex; align-items: center; justify-content: center; perspective: 600px; }
  .g-stage img { height: 215px; object-fit: contain; pointer-events: none; transform: rotateY(-8deg); transition: transform .5s ease; }
  .g-stage:hover img { transform: rotateY(8deg); }

  .g-list { margin: 18px 16px 0; display: flex; flex-direction: column; gap: 10px; }

  }

  .g-num { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .g-num.n1, .g-num.n2 { background: var(--blue); }

  .g-item .t1 { font-size: 14px; font-weight: 700; color: #232a3d; }

  /* ============ Toast ============ */
  .toast {

  /* 矮视口紧凑布局 */

<body>

            <svg class="mi" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.5" fill="#2f7cff"/><path d="M14.9 6.9a3.6 3.6 0 0 0-4.7 4.5L6 15.6a1.6 1.6 0 0 0 2.3 2.3l4.2-4.2a3.6 3.6 0 0 0 4.5-4.7l-2.3 2.3-2-.5-.5-2z" fill="#fff"/></svg>

        <div class="g-item"><span class="g-num n4">4</span><div><div class="t1">下拉小徐</div><div class="t2">按住下拉蓄力，松手喷火升空</div></div></div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));

  const GREETINGS = {
    left: '好嘞，我往左边看看',
    right: '好嘞，我往右边看看',
    sparkle: '看，我在闪闪发光！',
    launch: '点火起飞，跟我出发！',
  };
  const TOOLS = [
    { src: 'assets/tool-hammer.png', name: '破碎锤', verb: '破拆',
      chips: ['破碎锤适用哪些工况', '如何更换其他属具', '属具日常保养注意事项'],
      chipsAlt: ['破碎锤钎杆多久更换一次', '破碎锤作业油耗多少'] },
    { src: 'assets/tool-claw.png', name: '液压抓斗', verb: '抓取',
      chips: ['抓斗抓取力如何调节', '如何更换其他属具', '属具日常保养注意事项'],
      chipsAlt: ['抓斗开合速度慢怎么办', '抓斗夹不住物料怎么调'] },
    { src: 'assets/tool-scissors.png', name: '液压剪', verb: '剪切',
      chips: ['液压剪能剪多粗的钢筋', '如何更换其他属具', '属具日常保养注意事项'],
      chipsAlt: ['液压剪刃口怎么研磨', '液压剪剪切变慢原因'] },
  ];
  const toolBanner = (i) => '属具组装 · ' + TOOLS[i].name;
  const toolStatus = (i) => TOOLS[i].name + '已组装，准备' + TOOLS[i].verb + '作业';

  const state = { pose: 'front', busy: false, chipAlt: false, chatStarted: false, timer: null, hintDone: false };

  const robotBob = $('#robotBob'), robotPose = $('#robotPose'), stage = $('#stage');
  const robotShadow = $('#robotShadow');
  const POSES = {
    front: $('#robotPose img[data-pose="front"]'),
    left: $('#robotPose img[data-pose="left"]'),
    right: $('#robotPose img[data-pose="right"]'),
  };
  const banner = $('#banner'), bannerText = $('#bannerText');
  const armTool = $('#armTool'), toolImg = $('#toolImg'), portTag = $('#portTag');
  const greeting = $('#greeting'), panel = $('#panel'), chatlog = $('#chatlog');
  const toastEl = $('#toast'), input = $('#input'), inputbar = $('#inputbar');
  const chipsBox = $('#chips');

  /* ---------- 工具 ---------- */
  function toast(msg, ms = 1800) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  function setPose(name) {
    $$('#robotPose img').forEach((img) => img.classList.toggle('show', img.dataset.pose === name));
    state.pose = name;
    armTool.classList.toggle('hidden', name !== 'front');
    portTag.classList.toggle('on', name === 'front');
  }

  function setGreeting(text) {
    greeting.textContent = text;
    greeting.classList.remove('swap');
    void greeting.offsetWidth;
    greeting.classList.add('swap');
  }

  function showBanner(text) {
    bannerText.textContent = text;
    banner.classList.add('show');
  }

  function restartAnim(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function scheduleIdle() {
    clearTimeout(state.timer);
    state.timer = setTimeout(() => {
      if (state.busy) return scheduleIdle();
      if (state.pose !== 'front') setPose('front');
      setGreeting(toolStatus(toolIdx));
    }, 5000);
  }

  /* ---------- 动作 ---------- */
  function actLeft() {
    if (state.busy) return;
    setGreeting(GREETINGS.left);
    commitTurn(-1);
  }

  function actRight() {
    if (state.busy) return;
    setGreeting(GREETINGS.right);
    commitTurn(1);
  }

  function actSparkle() {
    if (state.busy) return;
    setGreeting(GREETINGS.sparkle);
    restartAnim(robotBob, 'spotlight');
    spawnSparks($('#robotSparkLayer'), 14, 60, 130);
    scheduleIdle();
  }

  function spawnSparks(layer, count, minDist, maxDist) {
    layer.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const sp = document.createElement('span');
      sp.className = 'spark';
      sp.textContent = '✦';
      const ang = (i / count) * Math.PI * 2 + Math.random() * .6;
      const dist = minDist + Math.random() * (maxDist - minDist);
      sp.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      sp.style.setProperty('--dy', Math.sin(ang) * dist * 0.8 + 'px');
      sp.style.setProperty('--sc', (0.7 + Math.random() * 1.1).toFixed(2));
      sp.style.setProperty('--rot', (Math.random() * 260 - 130).toFixed(0) + 'deg');
      sp.style.animationDelay = (Math.random() * .18) + 's';
      sp.style.fontSize = (12 + Math.random() * 8) + 'px';
      layer.appendChild(sp);
    }
  }

  function spawnFlames() {
    const layer = $('#flameLayer');
    for (let i = 0; i < 24; i++) {
      const s = document.createElement('span');
      s.className = 'fp';
      s.style.setProperty('--dx', (Math.random() * 180 - 90) + 'px');
      s.style.top = (54 + Math.random() * 16) + '%';
      s.style.animationDelay = (Math.random() * .4) + 's';
      const sz = 6 + Math.random() * 10;
      s.style.width = s.style.height = sz + 'px';
      layer.appendChild(s);
      setTimeout(() => s.remove(), 1600);
    }
  }

  /* ---------- 手势：左右 3D 旋转 + 下拉喷火升空 ---------- */
  const THRESHOLD = 70;        // 下拉发射阈值（px）
  const TURN_THRESHOLD = 16;   // 旋转松手阈值（deg）
  const TURN_MAX = 38;         // 拖拽最大角度
  let suppressUntil = 0;
  const pull = { on: false, y0: 0, dy: 0, captured: false, toasted: false };
  const rot = { mode: null, x0: 0, ry: 0, lastDir: 1, toasted: false };

  function applyPose(ry, dy) {
    rot.ry = ry; pull.dy = dy;
    robotPose.style.transform =
      'translateY(' + (dy * 0.55) + 'px) rotateY(' + ry + 'deg) scale(' + (1 + dy / 1000) + ')';
    robotShadow.style.transform =
      'translateX(calc(-50% + ' + (-ry * 0.8) + 'px)) scaleX(' + Math.max(0.55, 1 - Math.abs(ry) / 110) + ')';
  }

  function setTurnProgress(dir, p) {
    const side = dir < 0 ? 'left' : 'right';
    const other = dir < 0 ? 'right' : 'left';
    POSES.front.style.opacity = String(1 - p);
    POSES[side].style.opacity = String(p);
    POSES[other].style.opacity = '0';
    POSES.front.style.transform = 'scale(1)';
    POSES[side].style.transform = 'scale(1)';
    POSES[other].style.transform = 'scale(1)';
    armTool.style.opacity = String(1 - p);
    portTag.style.opacity = String(1 - p);
  }

  function clearInlinePoses() {
    ['front', 'left', 'right'].forEach((k) => {
      POSES[k].style.opacity = '';
      POSES[k].style.transform = '';
    });
    robotShadow.style.transform = '';
    armTool.style.opacity = '';
    portTag.style.opacity = '';
  }

  function springBack() {
    robotPose.classList.remove('dragging');
    applyPose(0, 0);
    setTurnProgress(rot.lastDir, 0);
    setTimeout(() => {
      clearInlinePoses();
      setPose('front');
      state.busy = false;
      scheduleIdle();
    }, 640);
  }

  function commitTurn(dir, holdMs) {
    state.busy = true;
    clearTimeout(state.timer);
    robotPose.classList.remove('dragging');
    applyPose(dir * 30, 0);
    setTurnProgress(dir, 1);
    rot.lastDir = dir;
    setTimeout(() => springBack(), holdMs || 1300);
  }

  function doLaunch() {
    state.busy = true;
    setGreeting(GREETINGS.launch);
    clearTimeout(state.timer);
    robotPose.classList.remove('dragging');
    robotPose.style.transition = 'transform .25s ease-out';
    robotPose.style.transform = '';
    robotShadow.style.transform = '';
    robotBob.classList.add('launching');
    setTimeout(() => {
      robotPose.style.transition = '';
      setPose('fly');
      spawnFlames();
      robotPose.classList.add('launch');
    }, 180);
    setTimeout(() => {
      robotPose.classList.remove('launch');
      robotPose.classList.add('landing');
    }, 1500);
    setTimeout(() => {
      robotPose.classList.remove('landing');
      robotBob.classList.remove('launching');
      setPose('front');
      state.busy = false;
      scheduleIdle();
    }, 2200);
  }

  stage.addEventListener('pointerdown', (e) => {
    if (state.busy || guideOpen()) return;
    pull.on = true; pull.y0 = e.clientY; pull.dy = 0;
    pull.captured = false; pull.toasted = false;
    rot.mode = null; rot.x0 = e.clientX; rot.ry = 0; rot.toasted = false;
  });
  stage.addEventListener('pointermove', (e) => {
    if (!pull.on) return;
    const dx = e.clientX - rot.x0;
    const dyDown = Math.max(0, e.clientY - pull.y0);
    if (!rot.mode && (Math.abs(dx) > 10 || dyDown > 10)) {
      rot.mode = Math.abs(dx) > dyDown ? 'rot' : 'pull';
      pull.captured = true;
      robotPose.classList.add('dragging');
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    }
    if (!rot.mode) return;
    if (rot.mode === 'rot') {
      const ry = Math.max(-TURN_MAX, Math.min(TURN_MAX, dx * 0.35));
      applyPose(ry, 0);
      setTurnProgress(ry < 0 ? -1 : 1, Math.min(Math.abs(ry) / 30, 1));
      if (Math.abs(ry) > 24 && !rot.toasted) { rot.toasted = true; toast('松开转身！', 900); }
    } else {
      pull.dy = Math.min(dyDown, 150);
      applyPose(0, pull.dy);
      const charged = pull.dy > THRESHOLD;
      robotBob.classList.toggle('charged', charged);
      if (charged && !pull.toasted) { pull.toasted = true; toast('松手发射！', 900); }
    }
  });
  function endPull() {
    if (!pull.on) return;
    pull.on = false;
    robotBob.classList.remove('charged');
    if (pull.captured) suppressUntil = Date.now() + 450;
    if (rot.mode === 'rot') {
      const ry = rot.ry;
      rot.mode = null;
      if (Math.abs(ry) > TURN_THRESHOLD && !state.busy) {
        const dir = ry < 0 ? -1 : 1;
        setGreeting(dir < 0 ? GREETINGS.left : GREETINGS.right);
        commitTurn(dir);
      } else {
        springBack();
      }
      return;
    }
    rot.mode = null;
    if (pull.dy > THRESHOLD && !state.busy) {
      pull.dy = 0;
      doLaunch();
    } else {
      robotPose.style.transition = 'transform .45s cubic-bezier(.2,.8,.3,1.2)';
      applyPose(0, 0);
      setTimeout(() => { robotPose.style.transition = ''; pull.dy = 0; }, 480);
    }
  }
  stage.addEventListener('pointerup', endPull);
  stage.addEventListener('pointercancel', endPull);

  function guideOpen() { return guide.classList.contains('open'); }

  /* ---------- 属具组装：静态展示（换装循环已暂时移除） ---------- */
  let toolIdx = 0;
  function setTool(i) {
    toolIdx = ((i % TOOLS.length) + TOOLS.length) % TOOLS.length;
    toolImg.src = TOOLS[toolIdx].src;
    showBanner(toolBanner(toolIdx));
    setGreeting(toolStatus(toolIdx));
    state.chipAlt = false;
    renderToolChips();
  }

  const ACTIONS = { left: actLeft, right: actRight, sparkle: actSparkle };

  /* ---------- 事件绑定 ---------- */
  $$('.zone').forEach((z) => {
    z.onclick = () => {
      if (Date.now() < suppressUntil) return;
      ACTIONS[z.dataset.act]();
      dismissHint();
    };
  });
  $('#voiceBtn').addEventListener('click', function () {
    this.classList.toggle('on');
    toast(this.classList.contains('on') ? '语音播报已开启' : '语音播报已关闭');
  });
  $('#resetBtn').addEventListener('click', () => {
    clearTimeout(state.timer);
    state.busy = false;
    pull.on = false;
    rot.mode = null; rot.ry = 0;
    robotBob.classList.remove('spotlight', 'charged', 'launching', 'thinking');
    robotPose.classList.remove('launch', 'landing', 'dragging');
    robotPose.style.transition = '';
    robotPose.style.transform = '';
    clearInlinePoses();
    armTool.classList.remove('cycling', 'hidden');
    portTag.classList.add('on');
    setPose('front');
    setGreeting(toolStatus(toolIdx));
    renderToolChips();
    if (state.chatStarted) resetChat();
    toast('已回到属具展示');
  });

  /* 交互说明 */
  const guide = $('#guide');
  $('#guideBtn').addEventListener('click', () => guide.classList.add('open'));
  $('#guideClose').onclick = () => guide.classList.remove('open');
  $$('.g-item, .hotbox').forEach((el) => {
    el.onclick = () => {
      guide.classList.remove('open');
      setTimeout(() => ACTIONS[el.dataset.act] && ACTIONS[el.dataset.act](), 250);
      dismissHint();
    };
  });

  /* 提示涟漪：首次交互后消失 */
  function dismissHint() {
    if (state.hintDone) return;
    state.hintDone = true;
    setTimeout(() => stage.classList.remove('hint'), 600);
  }

  /* ---------- 推荐问题（随属具联动） ---------- */
  function renderToolChips() {
    chipsBox.innerHTML = '';
    const set = state.chipAlt ? TOOLS[toolIdx].chipsAlt : TOOLS[toolIdx].chips;
    set.forEach((text, i) => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = text;
      b.style.animationDelay = (i * 0.06) + 's';
      b.addEventListener('click', () => {
        input.value = text;
        input.dispatchEvent(new Event('input'));
        input.focus();
      });
      chipsBox.appendChild(b);
    });
  }

  $('#refreshBtn').addEventListener('click', function () {
    this.classList.remove('spin'); void this.offsetWidth; this.classList.add('spin');
    chipsBox.classList.add('leaving');
    setTimeout(() => {
      chipsBox.classList.remove('leaving');
      state.chipAlt = !state.chipAlt;
      renderToolChips();
    }, 230);
  });

  /* ---------- 模式切换 ---------- */
  $$('.mode').forEach((m) => m.addEventListener('click', function () {
    $$('.mode').forEach((x) => x.classList.remove('active'));
    this.classList.add('active');
    toast(`已切换到「${this.dataset.mode}」模式`);
  }));

  /* ---------- 对话 ---------- */
  const REPLIES = [
    { k: ['保修', '质保'], r: '您好！您可以登录徐工官网服务专区，输入设备编号查询保修信息与质保期限；也可以拨打服务热线 400-110-9999，由客服协助查询。' },
    { k: ['预约', '维保', '保养', '上门'], r: '收到！上门维保可在徐工服务小程序预约：选择设备型号、填写故障描述后，系统会自动指派就近的服务工程师，一般 24 小时内响应。' },
    { k: ['报修', '故障', '维修', '坏了'], r: '设备报修请准备好设备序列号与故障现象描述，拨打 400-110-9999 服务热线，或切换到「故障诊断」模式，我会逐步帮您排查。' },
    { k: ['属具', '抓斗', '液压剪', '破碎锤'], r: '当前展示的是小徐的左臂属具快换系统：破碎锤用于破拆作业、液压抓斗用于抓取作业、液压剪用于剪切作业。页面每 5 秒自动演示一次抬臂换装，您也可以点击「如何更换其他属具」立即切换。' },
    { k: ['配件', '零件', '购买'], r: '原厂配件可通过徐工配件商城或当地授权经销商购买，正品保障、全国联保，支持在线查询物流进度。' },
    { k: ['网点', '服务', '附近', '地址'], r: '您可以在徐工官网「服务网点」页面按城市查询最近网点，支持地图导航与电话直连，部分地区还提供驻矿驻点服务。' },
    { k: ['你好', '您好', 'hi', 'Hi'], r: '您好！我是徐工智能助手小徐，可以帮您查保修、约维保、报故障，也可以点我周围的空白区域和我互动哦～' },
  ];
  const GENERIC = (q) => `好的，我已收到您的问题：「${q}」。这是交互动效演示页面，正式环境中我会结合徐工设备知识库为您详细解答。您也可以点击下方推荐问题快速开始。`;

  function addMsg(text, who) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    chatlog.appendChild(d);
    chatlog.scrollTop = chatlog.scrollHeight;
    return d;
  }

  function startChat() {
    if (state.chatStarted) return;
    state.chatStarted = true;
    panel.classList.add('hidden');
    chatlog.classList.add('show');
    const tip = document.createElement('div');
    tip.className = 'chat-tip';
    tip.textContent = '对话已开启 · 点右上角 × 可回到欢迎页';
    chatlog.appendChild(tip);
  }

  function resetChat() {
    state.chatStarted = false;
    chatlog.classList.remove('show');
    chatlog.innerHTML = '';
    panel.classList.remove('hidden');
  }

  function replyFor(q) {
    for (const item of REPLIES) if (item.k.some((k) => q.includes(k))) return item.r;
    return GENERIC(q);
  }

  function send() {
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    input.dispatchEvent(new Event('input'));
    startChat();
    addMsg(q, 'user');
    const typing = document.createElement('div');
    typing.className = 'msg bot typing';
    typing.innerHTML = '<i></i><i></i><i></i>';
    setTimeout(() => {
      chatlog.appendChild(typing);
      chatlog.scrollTop = chatlog.scrollHeight;
    }, 350);
    setTimeout(() => {
      typing.remove();
      addMsg(replyFor(q), 'bot');
    }, 1500 + Math.random() * 700);
  }

  $('#sendBtn').addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  input.addEventListener('input', () => inputbar.classList.toggle('has-text', !!input.value.trim()));
  $('#micBtn').addEventListener('click', () => toast('语音输入为演示功能'));

  /* ---------- 入场 ---------- */
  setPose('front');
  setTool(0);
  portTag.classList.add('on');
  window.addEventListener('load', () => {
    setTimeout(() => toast('点小徐互动，左右拖拽 3D 转身，下拉还能喷火升空～', 2800), 900);
  });
})();
</script>
</body>
</html>
